# JVM args for the Gradle daemon
# HTTP timeouts guard against stalled dependency downloads (socket reads that never complete)
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dorg.gradle.internal.http.connectionTimeout=30000 -Dorg.gradle.internal.http.socketTimeout=30000
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Only keep the resources of the actual dependencies
android.nonTransitiveRClass=true
